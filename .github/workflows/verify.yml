# V7.4 P0-2：CI 门禁示例
#
# 说明：本文件是 GitHub Actions 的参考实现，唯一真源是 scripts/verify.sh ——
# 本地与 CI 跑同一份命令，避免「本地绿、CI 红」的两套事实。
# 若仓库托管在 Gitee：Gitee Go 的流水线直接调用 `bash scripts/verify.sh --with-db` 即可，
# 不要照抄本文件里的 action 语法。
name: verify

on:
  push:
    branches: [main, master, dev, xyh_dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 本机门禁用离线 Maven；CI 无本地仓库，必须在线拉依赖
      - name: Freemarker 2.3.32 (i18n 快照契约)
        run: |
          curl -fsSL -o scripts/i18n_snapshot/freemarker.jar \
            https://repo.maven.apache.org/maven2/org/freemarker/freemarker/2.3.32/freemarker-2.3.32.jar
          test "$(stat -c%s scripts/i18n_snapshot/freemarker.jar)" -gt 100000

      - name: 定位 mysql 客户端
        run: echo "CG_MYSQL=$(command -v mysql)" >> "$GITHUB_ENV"

      # 部分迁移脚本带 UTF-8 BOM，MySQL 8.0 会当成非法字符；测试库统一去 BOM
      - name: 初始化测试库 gen_platform_test
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          out = Path('/tmp/codegen-sql')
          out.mkdir(exist_ok=True)
          for p in sorted(Path('docs/sql').glob('*.sql')):
              s = p.read_text(encoding='utf-8-sig')
              s = re.sub(r'(?im)^\s*(?:CREATE\s+(?:DATABASE|SCHEMA)\b[^;]*;|USE\s+`?\w+`?\s*;)\s*$', '', s)
              (out / p.name).write_text(s, encoding='utf-8')
          PY
          for db in gen_platform gen_platform_test; do
            mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS $db DEFAULT CHARSET utf8mb4;"
            for f in /tmp/codegen-sql/*.sql; do mysql -h 127.0.0.1 -uroot -proot "$db" < "$f"; done
          done

      # 空库冒烟要连本机 MySQL：127.0.0.1:3306 / root / root
      - name: 门禁（含空库冒烟）
        env:
          MVN_FLAGS: -B
          FREEMARKER_JAR: ${{ github.workspace }}/scripts/i18n_snapshot/freemarker.jar
          CG_DB_PASSWORD: root
          CG_DB_HOST: 127.0.0.1
        run: bash scripts/verify.sh --with-db

      - name: 归档失败日志与矩阵产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            logs/testcenter/
            target/surefire-reports/
            target/gen-matrix/manifest.json
          retention-days: 7
