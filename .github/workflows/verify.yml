# V7.4 P0-2：CI 门禁示例
#
# 说明：本文件是 GitHub Actions 的参考实现，唯一真源是 scripts/verify.sh ——
# 本地与 CI 跑同一份命令，避免「本地绿、CI 红」的两套事实。
# 若仓库托管在 Gitee：Gitee Go 的流水线直接调用 `bash scripts/verify.sh --with-db` 即可，
# 不要照抄本文件里的 action 语法。
name: verify

on:
  push:
    branches: [master, dev, xyh_dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 空库冒烟要连本机 MySQL：127.0.0.1:3306 / root / root
      - name: 门禁（含空库冒烟）
        env:
          CG_DB_PASSWORD: root
          CG_DB_HOST: 127.0.0.1
        run: bash scripts/verify.sh --with-db

      - name: 归档失败日志与矩阵产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            logs/testcenter/
            target/surefire-reports/
            target/gen-matrix/manifest.json
          retention-days: 7

  # V9.18 验证中心门禁：与页面执行器共用 scripts/testcenter-suites.mjs，
  # 只要 S8（截图）/ S9（产物等价性）出现 FAILED 就阻断合并；SKIPPED 表示环境依赖缺失，不阻断。
  verify-center-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 纯函数单测先行：目录递归比对 / 阈值判定有问题时，几秒内就能定位到具体维度
      - name: 验证中心纯函数单测（dir-diff）
        run: node --test scripts/dir-diff.test.mjs

      # headless 入口：无 MySQL / 无浏览器也能跑，缺依赖时如实 SKIPPED 而不是伪造 PASS
      - name: 验证中心门禁（S8 截图 / S9 产物等价性）
        run: node scripts/verify-center-cli.mjs --suites S8,S9

      - name: 归档验证中心证据（截图 / diff 清单 / 报告）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-center-evidence
          path: |
            target/verify-shots/
            target/verify-diff/
            target/verify-center/
          retention-days: 7
