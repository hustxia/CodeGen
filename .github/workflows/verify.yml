# V7.4 P0-2：CI 门禁示例
#
# 说明：本文件是 GitHub Actions 的参考实现，唯一真源是 scripts/verify.sh ——
# 本地与 CI 跑同一份命令，避免「本地绿、CI 红」的两套事实。
# 若仓库托管在 Gitee：Gitee Go 的流水线直接调用 `bash scripts/verify.sh --with-db` 即可，
# 不要照抄本文件里的 action 语法。
name: verify

on:
  push:
    branches: [main, master, dev, xyh_dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 本机门禁用离线 Maven；CI 无本地仓库，必须在线拉依赖
      - name: Freemarker 2.3.32 (i18n 快照契约)
        run: |
          curl -fsSL -o scripts/i18n_snapshot/freemarker.jar \
            https://repo.maven.apache.org/maven2/org/freemarker/freemarker/2.3.32/freemarker-2.3.32.jar
          test "$(stat -c%s scripts/i18n_snapshot/freemarker.jar)" -gt 100000

      - name: 定位 mysql 客户端
        run: echo "CG_MYSQL=$(command -v mysql)" >> "$GITHUB_ENV"

      # 部分迁移脚本带 UTF-8 BOM，MySQL 8.0 会当成非法字符；测试库统一去 BOM
      # 版本排序按数字段而非文件名字典序：V9.21__ 必须先于 V9.21.1__/V9.21.2__（否则种子表不存在）
      - name: 初始化测试库 gen_platform_test
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          out = Path('/tmp/codegen-sql')
          out.mkdir(exist_ok=True)
          def version_key(p):
              m = re.match(r'V(\d+(?:\.\d+)*)', p.name)
              return ([int(x) for x in m.group(1).split('.')] if m else [999], p.name)
          files = sorted(Path('docs/sql').glob('*.sql'), key=version_key)
          for p in files:
              s = p.read_text(encoding='utf-8-sig')
              s = re.sub(r'(?im)^\s*(?:CREATE\s+(?:DATABASE|SCHEMA)\b[^;]*;|USE\s+`?\w+`?\s*;)\s*$', '', s)
              (out / p.name).write_text(s, encoding='utf-8')
          with (out / 'ORDER.txt').open('w', encoding='utf-8', newline='\n') as fh:
              fh.write('\n'.join(p.name for p in files))
          PY
          for db in gen_platform gen_platform_test; do
            mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS $db DEFAULT CHARSET utf8mb4;"
            while IFS= read -r f; do
              mysql -h 127.0.0.1 -uroot -proot "$db" < "/tmp/codegen-sql/$f" || exit 1
            done < /tmp/codegen-sql/ORDER.txt
          done

      # 空库冒烟要连本机 MySQL：127.0.0.1:3306 / root / root
      - name: 门禁（含空库冒烟）
        env:
          MVN_FLAGS: -B
          FREEMARKER_JAR: ${{ github.workspace }}/scripts/i18n_snapshot/freemarker.jar
          CG_DB_PASSWORD: root
          CG_DB_HOST: 127.0.0.1
        run: bash scripts/verify.sh --with-db

      - name: 归档失败日志与矩阵产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            logs/testcenter/
            target/surefire-reports/
            target/gen-matrix/manifest.json
          retention-days: 7

  # V9.18 验证中心门禁：与页面执行器共用 scripts/testcenter-suites.mjs，
  # 只要 S8（截图）/ S9（产物等价性）出现 FAILED 就阻断合并；SKIPPED 表示环境依赖缺失，不阻断。
  verify-center-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 纯函数单测先行：目录递归比对 / 阈值判定有问题时，几秒内就能定位到具体维度
      - name: 验证中心纯函数单测（dir-diff）
        run: node --test scripts/dir-diff.test.mjs

      # headless 入口：无 MySQL / 无浏览器也能跑，缺依赖时如实 SKIPPED 而不是伪造 PASS
      - name: 验证中心门禁（S8 截图 / S9 产物等价性）
        run: node scripts/verify-center-cli.mjs --suites S8,S9

      - name: 归档验证中心证据（截图 / diff 清单 / 报告）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-center-evidence
          path: |
            target/verify-shots/
            target/verify-diff/
            target/verify-center/
          retention-days: 7

  # V9.16 冒烟门禁：Docker/H2/演示页静态契约 + H2 profile 真启动 + admin 登录。
  # 静态层秒级返回；动态层打包后起 jar 指向内存库，不依赖 MySQL/Docker daemon。
  smoke-v916:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 静态冒烟（Docker/H2/演示页契约）
        run: node scripts/smoke-v9.16.mjs

      - name: 打包 fat jar（供 H2 动态冒烟）
        run: mvn -B -q package -DskipTests

      - name: 动态冒烟（H2 真启动 + admin 登录）
        run: node scripts/smoke-v9.16.mjs --with-server

      # V9.17~V9.19：能力包/质量/建模三域契约 + 工具链实跑 + 新增端点动态验证
      - name: 冒烟 V9.17~V9.19（静态契约 + i18n/dir-diff 工具链）
        run: node scripts/smoke-v9.17-19.mjs

      - name: 动态冒烟 V9.17~V9.19（新增端点，复用已打包 jar）
        run: node scripts/smoke-v9.17-19.mjs --with-server

      - name: 归档冒烟报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-v916-report
          path: logs/smoke/
          retention-days: 7
